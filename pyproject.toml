[project]
name = "customizing-pytest-suite-by-hackebrot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs==18.2.0",
    "black==18.9b0",
    "flake8==3.7.6",
    "mypy",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-emoji>=0.2.0",
    "pytest-html>=4.2.0",
    "pytest-md>=0.2.0",
    "pytest-repeat>=0.9.4",
    "pytest-variables>=3.1.0",
]

[tool.uv]
exclude-newer = "30 days"
link-mode = "copy"

[tool.pytest.ini_options]
markers = [
    "slow: tests that take a long time to complete.",
    "txl: tests that involve TXL airport.",
]
addopts = """
--cov earth/ --cov-report html:tests/reports/coverage-html --variables conferences.json
"""